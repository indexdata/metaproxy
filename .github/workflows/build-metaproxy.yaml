# Build shared libraries with GCC and test the archive with Clang.
name: Build metaproxy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CC: gcc
      CXX: g++
      CFLAGS: -g -O2 -Wall
      CXXFLAGS: -g -O2 -Wall
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Clone YAZ
        uses: actions/checkout@v6
        with:
          repository: indexdata/yaz
          path: yaz
          ref: master
          submodules: recursive

      - name: Clone YAZPP
        uses: actions/checkout@v6
        with:
          repository: indexdata/yazpp
          path: yazpp
          ref: master
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool gcc g++ clang make bison \
            tclsh xsltproc docbook docbook-xml docbook-xsl librsvg2-bin \
            pkg-config libxslt1-dev libgnutls28-dev libicu-dev libstemmer-dev \
            libboost-dev libboost-system-dev libboost-thread-dev \
            libboost-test-dev libboost-regex-dev libxml2-utils trang

      - name: Run buildconf for YAZ
        working-directory: yaz
        run: ./buildconf.sh

      - name: Configure shared YAZ libraries with GCC
        working-directory: yaz
        run: ./configure --enable-shared --disable-static

      - name: Build YAZ
        working-directory: yaz
        run: make -j4

      - name: Run buildconf for YAZ++
        working-directory: yazpp
        run: ./buildconf.sh

      - name: Configure shared YAZ++ libraries with GCC
        working-directory: yazpp
        run: ./configure --with-yaz=../yaz --enable-shared --disable-static

      - name: Build YAZ++
        working-directory: yazpp
        run: make -j4

      - name: Run buildconf for metaproxy
        run: ./buildconf.sh

      - name: Configure shared libraries with GCC
        run: ./configure --with-yazpp=yazpp --enable-shared --disable-static

      - name: Build and test with GCC
        run: make -j4 check

      - name: Build distribution archive
        run: make -j4 dist

      - name: Unpack distribution archive for Clang
        if: github.event_name != 'push'
        run: |
          . ./IDMETA
          mkdir build-clang
          tar -xzf "metaproxy-$VERSION.tar.gz" -C build-clang --strip-components=1

      - name: Configure static libraries with Clang
        if: github.event_name != 'push'
        working-directory: build-clang
        env:
          CC: clang
          CXX: clang++
        run: >
          ./configure --with-yazpp="$GITHUB_WORKSPACE/yazpp"
          --disable-shared --enable-static

      - name: Build and test with Clang
        if: github.event_name != 'push'
        working-directory: build-clang
        run: make -j4 check

      - name: Show build and test failures
        if: failure()
        run: |
          for build in yaz yazpp . build-clang; do
            for log in config.log src/test-suite.log test/test-suite.log client/test-suite.log ztest/test-suite.log; do
              if test -f "$build/$log"; then
                echo "::group::$build/$log"
                cat "$build/$log"
                echo "::endgroup::"
              fi
            done
          done
